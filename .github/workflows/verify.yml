name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Source and documentation checks
        run: |
          python3 tools/check_project.py
          python3 -m unittest discover -s tools/tests -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Required Android SDK packages
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build actual app and run JVM tests
        working-directory: android/VagDiag
        run: gradle --no-daemon --console=plain :app:assembleDebug :app:testDebugUnitTest
      - name: Upload JVM test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-jvm-test-reports
          path: android/VagDiag/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
